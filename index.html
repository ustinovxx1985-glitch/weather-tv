<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Погода</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: linear-gradient(160deg, #0f172a 0%, #1e293b 100%);
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            text-align: center;
            padding: 20px;
        }
        .widget {
            background: rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 32px;
            padding: 60px 80px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }
        #city { font-size: 2.5rem; font-weight: 500; letter-spacing: 0.05em; opacity: 0.8; margin-bottom: 10px; }
        #temp { font-size: 6rem; font-weight: 200; line-height: 1.1; }
        #temp sup { font-size: 2.5rem; font-weight: 300; vertical-align: super; opacity: 0.7; }
        #desc { font-size: 1.8rem; font-weight: 300; opacity: 0.8; margin-top: 10px; text-transform: capitalize; }
        
        .details {
            display: flex;
            gap: 40px;
            justify-content: center;
            font-size: 1.5rem;
            margin-top: 40px;
        }
        .detail-item { display: flex; flex-direction: column; gap: 8px; }
        .detail-label { font-size: 1.1rem; opacity: 0.6; text-transform: uppercase; letter-spacing: 1px; }
        .detail-value { font-weight: 400; }
    </style>
</head>
<body>
    <div class="widget">
        <div id="city">Октябрьский</div>
        <div id="temp">--<sup>°C</sup></div>
        <div id="desc">Загрузка...</div>
        
        <div class="details">
            <div class="detail-item">
                <span class="detail-label">Ветер</span>
                <span class="detail-value" id="wind">-- м/с</span>
            </div>
            <div class="detail-item">
                <span class="detail-label">Давление</span>
                <span class="detail-value" id="pressure">-- мм</span>
            </div>
            <div class="detail-item">
                <span class="detail-label">Влажность</span>
                <span class="detail-value" id="humidity">-- %</span>
            </div>
        </div>
    </div>

    <script>
        // Тот самый запрос GraphQL с сайта Яндекса, адаптированный под ваши нужды
        const query = `
        {
          weatherByPoint(request: { lat: 56.2194, lon: 42.0431 }) {
            now {
              temperature
              humidity
              pressure
              windSpeed
              condition
            }
          }
        }`;

        // Словарь для перевода погодных условий Яндекса
        const conditions = {
            'clear': 'Ясно',
            'partly-cloudy': 'Малооблачно',
            'cloudy': 'Облачно',
            'overcast': 'Пасмурно',
            'drizzle': 'Морось',
            'light-rain': 'Небольшой дождь',
            'rain': 'Дождь',
            'moderate-rain': 'Умеренный дождь',
            'heavy-rain': 'Сильный дождь',
            'continuous-heavy-rain': 'Ливень',
            'showers': 'Ливневые дожди',
            'wet-snow': 'Дождь со снегом',
            'light-snow': 'Небольшой снег',
            'snow': 'Снег',
            'snow-showers': 'Снегопад',
            'hail': 'Град',
            'thunderstorm': 'Гроза',
            'thunderstorm-with-rain': 'Гроза с дождем',
            'thunderstorm-with-hail': 'Гроза с градом'
        };

        async function fetchWeather() {
            try {
                // Обращаемся к вашему Cloudflare Worker, который проксирует запрос в Яндекс
                const response = await fetch('https://weather-proxy.ustinovxx1985.workers.dev/', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ query })
                });

                const data = await response.json();
                const now = data.data.weatherByPoint.now;

                // Обновляем данные на экране
                document.getElementById('temp').innerHTML = `${now.temperature}<sup>°C</sup>`;
                document.getElementById('desc').textContent = conditions[now.condition] || now.condition;
                document.getElementById('wind').textContent = `${now.windSpeed} м/с`;
                document.getElementById('pressure').textContent = `${now.pressure} мм`;
                document.getElementById('humidity').textContent = `${now.humidity} %`;

            } catch (error) {
                console.error("Ошибка загрузки:", error);
                document.getElementById('desc').textContent = "Ошибка связи";
            }
        }

        fetchWeather();
        setInterval(fetchWeather, 15 * 60 * 1000); // Обновление каждые 15 минут
    </script>
</body>
</html>
