<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Погода</title>
    <style>
        /* ... (ваши стили остаются без изменений) ... */
        body { font-family: sans-serif; background: #0f172a; color: #f8fafc; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; text-align: center; }
        .widget { background: rgba(255, 255, 255, 0.06); padding: 60px 80px; border-radius: 32px; }
        #city { font-size: 2.5rem; opacity: 0.8; margin-bottom: 10px; }
        #temp { font-size: 6rem; font-weight: 200; line-height: 1.1; }
        #desc { font-size: 1.8rem; opacity: 0.8; margin-top: 10px; text-transform: capitalize; }
        .details { display: flex; gap: 40px; justify-content: center; font-size: 1.5rem; margin-top: 40px; }
        .detail-item { display: flex; flex-direction: column; gap: 8px; }
        .detail-label { font-size: 1.1rem; opacity: 0.6; }
    </style>
</head>
<body>
    <div class="widget">
        <div id="city">Октябрьский</div>
        <div id="temp">--<sup>°C</sup></div>
        <div id="desc">Загрузка...</div>
        <div class="details">
            <div class="detail-item"><span class="detail-label">Ветер</span><span id="wind">-- м/с</span></div>
            <div class="detail-item"><span class="detail-label">Давление</span><span id="pressure">-- мм</span></div>
            <div class="detail-item"><span class="detail-label">Влажность</span><span id="humidity">-- %</span></div>
        </div>
    </div>

    <script>
        // Полный GraphQL-запрос со всеми нужными полями
        const query = `
        {
          weatherByPoint(request: { lat: 56.2194, lon: 42.0431 }) {
            now {
              temperature
              humidity
              pressure
              windSpeed
              condition
            }
          }
        }`;

        const conditions = { /* ... ваш словарь переводов ... */ };

        async function fetchWeather() {
            try {
                const response = await fetch('https://weather-proxy.ustinovxx1985.workers.dev/', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ query })
                });

                if (!response.ok) throw new Error(`HTTP error ${response.status}`);
                const data = await response.json();
                
                // Проверка на наличие ошибок в ответе API
                if (data.errors) {
                    throw new Error(data.errors[0].message);
                }

                const now = data.data.weatherByPoint.now;
                document.getElementById('temp').innerHTML = `${now.temperature}<sup>°C</sup>`;
                document.getElementById('desc').textContent = conditions[now.condition] || now.condition;
                document.getElementById('wind').textContent = `${now.windSpeed} м/с`;
                document.getElementById('pressure').textContent = `${now.pressure} мм`;
                document.getElementById('humidity').textContent = `${now.humidity} %`;

            } catch (error) {
                console.error("Ошибка загрузки:", error);
                document.getElementById('desc').textContent = "Ошибка данных";
            }
        }

        fetchWeather();
        setInterval(fetchWeather, 2 * 60 * 60 * 1000); // Обновление раз в 2 часа
    </script>
</body>
</html>
