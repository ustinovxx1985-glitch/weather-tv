<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Погода</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body, html {
            height: 100%;
            margin: 0;
            overflow: hidden;
            background: #0f172a; /* Темный фон */
            display: flex;
            justify-content: center; /* Центрируем по горизонтали */
            align-items: center;     /* Центрируем по вертикали */
        }
        
        img {
            /* Заставляем картинку занять 95% экрана, сохраняя пропорции */
            width: 95vw;
            height: 95vh;
            object-fit: contain; 
            /* Убрали transform: scale, теперь картинка не обрезается */
        }
    </style>
</head>
<body>
    <!-- 
      &m - Цельсии и км/ч
      &lang=ru - русский язык
      &background=0f172a - цвет фона картинки совпадает с фоном сайта
    -->
    <img src="https://wttr.in/56.2194,42.0431.png?0&lang=ru&m&background=0f172a" alt="Погода">
</body>
</html>
