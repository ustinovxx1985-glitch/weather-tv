<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Погода</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body, html {
            height: 100%;
            margin: 0;
            overflow: hidden;
            background: #0f172a; /* Темный фон */
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        /* Растягиваем картинку на весь экран телевизора */
        img {
            width: 100vw;
            height: 100vh;
            object-fit: contain; /* Сохраняет пропорции, не растягивая текст */
            padding: 10px; /* Небольшие отступы от краев */
        }
    </style>
</head>
<body>
    <!-- 
      &m - метрическая система (Цельсии, км/ч)
      &w=1200 - ширина картинки 1200px (высокое разрешение)
      &lang=ru - русский язык
      &background=0f172a - цвет фона (сливается с нашим)
    -->
    <img src="https://wttr.in/56.2194,42.0431.png?0&lang=ru&m&w=1200&background=0f172a" alt="Погода">
</body>
</html>
