<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Погода</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body, html {
            height: 100%;
            margin: 0;
            overflow: hidden;
            background: #0f172a; /* Темный фон */
            display: flex;
            justify-content: center;
            align-items: center;
        }
        /* Настраиваем картинку, чтобы она была по центру и не растягивалась криво */
        img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain; 
            /* Легкая прозрачность, чтобы вписалась в фон */
            opacity: 0.9; 
        }
    </style>
</head>
<body>
    <!-- Запрашиваем готовую картинку погоды (формат PNG) -->
    <img src="https://wttr.in/56.2194,42.0431.png?0&lang=ru&u" alt="Погода">
</body>
</html>
