<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Погода</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: linear-gradient(160deg, #0f172a 0%, #1e293b 100%);
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            text-align: center;
            padding: 20px;
        }
        .widget {
            background: rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 32px;
            padding: 50px 70px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            min-width: 400px;
        }
        #city { font-size: 2.5rem; font-weight: 500; letter-spacing: 0.05em; opacity: 0.8; margin-bottom: 10px; }
        #temp { font-size: 6rem; font-weight: 200; line-height: 1.1; }
        #temp sup { font-size: 2.5rem; font-weight: 300; vertical-align: super; opacity: 0.7; }
        #desc { font-size: 1.8rem; font-weight: 300; opacity: 0.8; margin-top: 5px; margin-bottom: 30px; text-transform: capitalize; }
        
        .details {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
            font-size: 1.4rem;
            font-weight: 300;
            opacity: 0.9;
        }
        .detail-row {
            display: flex;
            justify-content: space-between;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding-bottom: 8px;
        }
        .detail-row:last-child { border-bottom: none; }
    </style>
</head>
<body>
    <div class="widget">
        <div id="city">Октябрьский</div>
        <div id="temp">--<sup>°C</sup></div>
        <div id="desc">Загрузка...</div>
        
        <div class="details">
            <div class="detail-row">
                <span>💨 Ветер:</span>
                <span id="wind">-- км/ч</span>
            </div>
            <div class="detail-row">
                <span>💧 Влажность:</span>
                <span id="humidity">-- %</span>
            </div>
            <div class="detail-row">
                <span>⏲️ Давление:</span>
                <span id="pressure">-- мм рт. ст.</span>
            </div>
        </div>
    </div>

    <script>
        async function fetchWeather() {
            try {
                // Запрос к wttr.in в формате JSON
                const response = await fetch('https://wttr.in/56.2194,42.0431?format=j1');
                if (!response.ok) throw new Error(`HTTP error ${response.status}`);
                
                const data = await response.json();
                const current = data.current_condition[0];
                
                // Получаем данные
                const temp = current.temp_C;
                const desc = current.lang_ru ? current.lang_ru[0].value : current.weatherDesc[0].value;
                const wind = current.windspeedKmph; // Скорость ветра в км/ч
                const humidity = current.humidity; // Влажность в %
                
                // Конвертируем давление из гектопаскалей (hPa) в мм ртутного столба
                const pressureMmHg = Math.round(current.pressure * 0.750062);

                // Обновляем интерфейс
                document.getElementById("temp").innerHTML = `${temp}<sup>°C</sup>`;
                document.getElementById("desc").textContent = desc;
                document.getElementById("wind").textContent = `${wind} км/ч`;
                document.getElementById("humidity").textContent = `${humidity} %`;
                document.getElementById("pressure").textContent = `${pressureMmHg} мм рт. ст.`;

            } catch (error) {
                console.error("Ошибка загрузки:", error);
                document.getElementById("desc").textContent = "Ошибка данных";
            }
        }

        fetchWeather();
        setInterval(fetchWeather, 15 * 60 * 1000); // Обновление каждые 15 минут
    </script>
</body>
</html>
