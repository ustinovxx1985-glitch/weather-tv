<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Погода</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: linear-gradient(160deg, #0f172a 0%, #1e293b 100%);
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            text-align: center;
            padding: 20px;
        }
        .widget {
            background: rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 32px;
            padding: 60px 80px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }
        #city { font-size: 2.5rem; font-weight: 500; letter-spacing: 0.05em; opacity: 0.8; margin-bottom: 10px; }
        #icon { font-size: 7rem; line-height: 1; margin: 10px 0; }
        #temp { font-size: 6rem; font-weight: 200; line-height: 1.1; }
        #temp sup { font-size: 2.5rem; font-weight: 300; vertical-align: super; opacity: 0.7; }
        #desc { font-size: 1.8rem; font-weight: 300; opacity: 0.8; margin-top: 10px; }
        #wind { font-size: 1.4rem; font-weight: 300; opacity: 0.6; margin-top: 30px; }
    </style>
</head>
<body>
    <div class="widget">
        <div id="city">Октябрьский</div>
        <div id="icon">⏳</div>
        <div id="temp">--<sup>°C</sup></div>
        <div id="desc">Загрузка...</div>
        <div id="wind"></div>
    </div>

    <script>
        // ВСТАВЬТЕ СЮДА ВАШ КЛЮЧ ИЗ КАБИНЕТА ЯНДЕКСА
        const YANDEX_API_KEY = "4263fc7f-72f6-4b63-be74-b9b6eaee8676"; 
        
        // Координаты Москвы (можно изменить на свои)
        const lat = 56.2194;
        const lon = 42.0431;

        // Словарь для перевода погодных условий Яндекса в иконки и русский текст
        const weatherMap = {
            'clear': { icon: '☀️', desc: 'Ясно' },
            'partly-cloudy': { icon: '🌤️', desc: 'Малооблачно' },
            'cloudy': { icon: '⛅', desc: 'Облачно' },
            'overcast': { icon: '☁️', desc: 'Пасмурно' },
            'drizzle': { icon: '🌦️', desc: 'Морось' },
            'light-rain': { icon: '🌦️', desc: 'Небольшой дождь' },
            'rain': { icon: '🌧️', desc: 'Дождь' },
            'moderate-rain': { icon: '🌧️', desc: 'Умеренный дождь' },
            'heavy-rain': { icon: '🌧️', desc: 'Сильный дождь' },
            'continuous-heavy-rain': { icon: '🌧️', desc: 'Ливень' },
            'showers': { icon: '🌦️', desc: 'Ливневые дожди' },
            'wet-snow': { icon: '🌨️', desc: 'Дождь со снегом' },
            'light-snow': { icon: '🌨️', desc: 'Небольшой снег' },
            'snow': { icon: '❄️', desc: 'Снег' },
            'snow-showers': { icon: '❄️', desc: 'Снегопад' },
            'hail': { icon: '🧊', desc: 'Град' },
            'thunderstorm': { icon: '⛈️', desc: 'Гроза' },
            'thunderstorm-with-rain': { icon: '⛈️', desc: 'Гроза с дождем' },
            'thunderstorm-with-hail': { icon: '⛈️', desc: 'Гроза с градом' }
        };

        async function fetchYandexWeather() {
            // Запрос к API Яндекса (GraphQL)
            const query = `
            {
              weatherByPoint(request: { lat: ${lat}, lon: ${lon} }) {
                now {
                  temperature
                  condition
                  windSpeed
                }
              }
            }`;

            try {
                const response = await fetch('https://api.weather.yandex.ru/graphql/query', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-Yandex-Weather-Key': YANDEX_API_KEY
                    },
                    body: JSON.stringify({ query: query })
                });

                if (!response.ok) throw new Error(`HTTP error ${response.status}`);
                
                const data = await response.json();
                
                // Проверка, что данные пришли
                if (!data.data || !data.data.weatherByPoint) {
                    throw new Error("Неверный формат ответа или ошибка API");
                }

                const weather = data.data.weatherByPoint.now;
                
                // Получаем данные
                const temp = Math.round(weather.temperature);
                const condition = weather.condition;
                const wind = weather.windSpeed;
                
                // Ищем иконку и описание в словаре, если нет — ставим заглушку
                const info = weatherMap[condition] || { icon: '🌡️', desc: condition };

                // Обновляем страницу
                document.getElementById("temp").innerHTML = `${temp}<sup>°C</sup>`;
                document.getElementById("icon").textContent = info.icon;
                document.getElementById("desc").textContent = info.desc;
                document.getElementById("wind").textContent = `💨 Ветер: ${wind} м/с`;

            } catch (error) {
                console.error("Ошибка загрузки погоды:", error);
                document.getElementById("desc").textContent = "Ошибка данных";
                document.getElementById("icon").textContent = "⚠️";
            }
        }

        // Запускаем загрузку сразу
        fetchYandexWeather();
        
        // Обновляем каждые 60 минут (3600000 мс), чтобы не превысить лимит 30 запросов в сутки
        setInterval(fetchYandexWeather, 3600000); 
    </script>
</body>
</html>
