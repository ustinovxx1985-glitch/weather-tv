<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Погода</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body, html {
            height: 100%;
            margin: 0;
            overflow: hidden;
            background: #0f172a; /* Темный фон */
            display: flex;
            justify-content: center; 
            align-items: center;     
        }
        
        img {
            width: 50vw;
            height: 50vh;
            object-fit: contain; 
        }
    </style>
</head>
<body>
    <!-- Добавили id="weatherImg", чтобы скрипт мог к ней обращаться -->
    <img id="weatherImg" src="https://wttr.in/Октябрьский:56.2194,42.0431.png?0&lang=ru&m&background=0f172a" alt="Погода">

    <script>
        // Функция для принудительного обновления картинки
        function updateWeather() {
            const img = document.getElementById('weatherImg');
            // Добавляем ?t=текущее_время, чтобы браузер не брал картинку из кэша
            img.src = `https://wttr.in/Октябрьский:56.2194,42.0431.png?0&lang=ru&m&background=0f172a&t=${new Date().getTime()}`;
        }

        // Обновляем каждые 15 минут (900 000 миллисекунд)
        setInterval(updateWeather, 15 * 60 * 1000);
    </script>
</body>
</html>
