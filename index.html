<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Погода</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body, html {
            height: 100%;
            margin: 0;
            overflow: hidden;
            background: #0f172a; /* Темный фон */
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        img {
            /* Увеличиваем картинку в 2.5 раза, чтобы она заняла весь экран */
            transform: scale(2.5);
            /* Ограничиваем максимальный размер, чтобы не было диких искажений */
            max-width: 80vw; 
            max-height: 80vh;
            object-fit: contain; 
        }
    </style>
</head>
<body>
    <!-- 
      &m - метрическая система (Цельсии, км/ч)
      &w=1200 - запрашиваем картинку шириной 1200px (четкая)
    -->
    <img src="https://wttr.in/56.2194,42.0431.png?0&lang=ru&m&w=1200&background=0f172a" alt="Погода">
</body>
</html>
