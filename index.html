<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Погода</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: linear-gradient(160deg, #0f172a 0%, #1e293b 100%);
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        .widget {
            text-align: center;
            width: 90%;
            max-width: 800px;
        }
        #city { font-size: 4rem; font-weight: 500; letter-spacing: 0.05em; opacity: 0.8; margin-bottom: 10px; }
        #temp { font-size: 10rem; font-weight: 200; line-height: 1; margin: 20px 0; }
        #temp sup { font-size: 4rem; font-weight: 300; vertical-align: super; opacity: 0.7; }
        #desc { font-size: 3rem; font-weight: 300; opacity: 0.8; margin-bottom: 40px; text-transform: capitalize; }
        
        .details {
            display: flex;
            justify-content: center;
            gap: 50px;
            font-size: 2rem;
            font-weight: 300;
        }
        .detail-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }
        .detail-label { font-size: 1.2rem; opacity: 0.5; text-transform: uppercase; letter-spacing: 1px; }
        .detail-value { font-size: 2.5rem; font-weight: 400; }
    </style>
</head>
<body>
    <div class="widget">
        <div id="city">Октябрьский</div>
        <div id="temp">--<sup>°C</sup></div>
        <div id="desc">Загрузка...</div>
        
        <div class="details">
            <div class="detail-item">
                <span class="detail-label">Ветер</span>
                <span class="detail-value" id="wind">--</span>
            </div>
            <div class="detail-item">
                <span class="detail-label">Влажность</span>
                <span class="detail-value" id="humidity">--</span>
            </div>
            <div class="detail-item">
                <span class="detail-label">Давление</span>
                <span class="detail-value" id="pressure">--</span>
            </div>
        </div>
    </div>

    <script>
        async function fetchWeather() {
            try {
                // Запрос к wttr.in в формате JSON
                const response = await fetch('https://wttr.in/56.2194,42.0431?format=j1');
                if (!response.ok) throw new Error(`HTTP error ${response.status}`);
                
                const data = await response.json();
                const current = data.current_condition[0];
                
                // Получаем данные
                const temp = current.temp_C;
                const desc = current.lang_ru ? current.lang_ru[0].value : current.weatherDesc[0].value;
                const wind = current.windspeedKmph; // Скорость ветра в км/ч
                const humidity = current.humidity; // Влажность в %
                
                // Конвертируем давление из гектопаскалей (hPa) в мм ртутного столба
                const pressureMmHg = Math.round(current.pressure * 0.750062);

                // Обновляем интерфейс
                document.getElementById("temp").innerHTML = `${temp}<sup>°C</sup>`;
                document.getElementById("desc").textContent = desc;
                document.getElementById("wind").textContent = `${wind} км/ч`;
                document.getElementById("humidity").textContent = `${humidity} %`;
                document.getElementById("pressure").textContent = `${pressureMmHg} мм`;

            } catch (error) {
                console.error("Ошибка загрузки:", error);
                // Если не грузится, покажем это через 5 секунд
                setTimeout(() => {
                    if (document.getElementById("desc").textContent === "Загрузка...") {
                        document.getElementById("desc").textContent = "Нет связи...";
                    }
                }, 5000);
            }
        }

        fetchWeather();
        setInterval(fetchWeather, 15 * 60 * 1000); 
    </script>
</body>
</html>
