<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Погода</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: linear-gradient(160deg, #0f172a 0%, #1e293b 100%);
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            text-align: center;
            padding: 20px;
        }
        .widget {
            background: rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 32px;
            padding: 60px 80px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }
        #city { font-size: 2.5rem; font-weight: 500; letter-spacing: 0.05em; opacity: 0.8; margin-bottom: 10px; }
        #icon { font-size: 7rem; line-height: 1; margin: 10px 0; }
        #temp { font-size: 6rem; font-weight: 200; line-height: 1.1; }
        #temp sup { font-size: 2.5rem; font-weight: 300; vertical-align: super; opacity: 0.7; }
        #desc { font-size: 1.8rem; font-weight: 300; opacity: 0.8; margin-top: 10px; }
        #wind { font-size: 1.4rem; font-weight: 300; opacity: 0.6; margin-top: 30px; }
    </style>
</head>
<body>
    <div class="widget">
        <div id="city">Октябрьский</div>
        <div id="icon">⏳</div>
        <div id="temp">--<sup>°C</sup></div>
        <div id="desc">Загрузка...</div>
        <div id="wind"></div>
    </div>

    <script>
        const lat = 56.2194;
        const lon = 42.0431;

        const weatherMap = {
            0: { icon: "☀️", desc: "Ясно" },
            1: { icon: "🌤️", desc: "Преимущественно ясно" },
            2: { icon: "⛅", desc: "Переменная облачность" },
            3: { icon: "☁️", desc: "Пасмурно" },
            45: { icon: "🌫️", desc: "Туман" },
            48: { icon: "🌫️", desc: "Туман с изморозью" },
            51: { icon: "🌦️", desc: "Лёгкая морось" },
            53: { icon: "🌦️", desc: "Умеренная морось" },
            55: { icon: "🌧️", desc: "Сильная морось" },
            61: { icon: "🌦️", desc: "Небольшой дождь" },
            63: { icon: "🌧️", desc: "Умеренный дождь" },
            65: { icon: "🌧️", desc: "Сильный дождь" },
            71: { icon: "🌨️", desc: "Небольшой снег" },
            73: { icon: "❄️", desc: "Умеренный снег" },
            75: { icon: "❄️", desc: "Сильный снег" },
            77: { icon: "❄️", desc: "Снежная крупа" },
            80: { icon: "🌦️", desc: "Небольшие ливни" },
            81: { icon: "🌧️", desc: "Умеренные ливни" },
            82: { icon: "⛈️", desc: "Сильные ливни" },
            95: { icon: "⛈️", desc: "Гроза" },
            96: { icon: "⛈️", desc: "Гроза с градом" },
            99: { icon: "⛈️", desc: "Сильная гроза с градом" }
        };

        async function fetchWeather() {
            try {
                // Формируем исходный URL для Open-Meteo
                const targetUrl = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current_weather=true&timezone=Europe/Moscow`;
                
                // Пропускаем его через прокси codetabs для обхода блокировки
                const url = `https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(targetUrl)}`;

                const response = await fetch(url);
                if (!response.ok) throw new Error(`HTTP error ${response.status}`);
                
                const data = await response.json();
                const current = data.current_weather;
                
                const temp = Math.round(current.temperature);
                const wind = current.windspeed;
                const code = current.weathercode;
                const info = weatherMap[code] || { icon: "🌡️", desc: "Неизвестно" };

                document.getElementById("temp").innerHTML = `${temp}<sup>°C</sup>`;
                document.getElementById("icon").textContent = info.icon;
                document.getElementById("desc").textContent = info.desc;
                document.getElementById("wind").textContent = `💨 Ветер: ${wind} км/ч`;

            } catch (error) {
                console.error("Ошибка:", error);
                document.getElementById("desc").textContent = "Ошибка данных";
                document.getElementById("icon").textContent = "⚠️";
            }
        }

        fetchWeather();
        setInterval(fetchWeather, 15 * 60 * 1000); 
    </script>
</body>
</html>
