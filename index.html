<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Погода</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: linear-gradient(160deg, #0f172a 0%, #1e293b 100%);
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            text-align: center;
            padding: 20px;
        }
        .widget {
            background: rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 32px;
            padding: 60px 80px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }
        #city { font-size: 2.5rem; font-weight: 500; letter-spacing: 0.05em; opacity: 0.8; margin-bottom: 10px; }
        #temp { font-size: 6rem; font-weight: 200; line-height: 1.1; }
        #temp sup { font-size: 2.5rem; font-weight: 300; vertical-align: super; opacity: 0.7; }
        #desc { font-size: 1.8rem; font-weight: 300; opacity: 0.8; margin-top: 10px; text-transform: capitalize; }
        
        .details {
            display: flex;
            gap: 40px;
            justify-content: center;
            font-size: 1.5rem;
            margin-top: 40px;
        }
        .detail-item { display: flex; flex-direction: column; gap: 8px; }
        .detail-label { font-size: 1.1rem; opacity: 0.6; text-transform: uppercase; letter-spacing: 1px; }
        .detail-value { font-weight: 400; }
    </style>
</head>
<body>
    <div class="widget">
        <div id="city">Октябрьский</div>
        <div id="temp">--<sup>°C</sup></div>
        <div id="desc">Загрузка...</div>
        
        <div class="details">
            <div class="detail-item">
                <span class="detail-label">Ветер</span>
                <span class="detail-value" id="wind">-- км/ч</span>
            </div>
            <div class="detail-item">
                <span class="detail-label">Давление</span>
                <span class="detail-value" id="pressure">-- мм</span>
            </div>
            <div class="detail-item">
                <span class="detail-label">Влажность</span>
                <span class="detail-value" id="humidity">-- %</span>
            </div>
        </div>
    </div>

    <script>
        async function fetchWeather() {
            try {
                // Запрос напрямую к wttr.in в формате JSON
                const response = await fetch('https://wttr.in/56.2194,42.0431?format=j1&lang=ru');
                if (!response.ok) throw new Error(`HTTP error ${response.status}`);
                
                const data = await response.json();
                const current = data.current_condition[0];
                
                // Извлекаем данные
                const temp = current.temp_C;
                const wind = current.windspeedKmph;
                const humidity = current.humidity;
                const desc = current.lang_ru ? current.lang_ru[0].value : current.weatherDesc[0].value;
                
                // Переводим давление из гектопаскалей (hPa) в мм ртутного столба
                const pressureMmHg = Math.round(current.pressure * 0.750062);

                // Выводим на экран
                document.getElementById("temp").innerHTML = `${temp}<sup>°C</sup>`;
                document.getElementById("desc").textContent = desc;
                document.getElementById("wind").textContent = `${wind} км/ч`;
                document.getElementById("pressure").textContent = `${pressureMmHg} мм`;
                document.getElementById("humidity").textContent = `${humidity} %`;

            } catch (error) {
                console.error("Ошибка:", error);
                document.getElementById("desc").textContent = "Ошибка данных";
            }
        }

        fetchWeather();
        setInterval(fetchWeather, 15 * 60 * 1000); 
    </script>
</body>
</html>
