<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Погода</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body, html {
            height: 100%;
            margin: 0;
            overflow: hidden;
            background: #0f172a; /* Темный фон на случай загрузки */
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
            /* Небольшая стилизация, чтобы вписать в дизайн */
            filter: invert(1) hue-rotate(180deg) contrast(0.9) brightness(0.8);
        }
    </style>
</head>
<body>
    <!-- Загружаем страницу wttr.in напрямую, без JavaScript и прокси -->
    <iframe src="https://wttr.in/56.2194,42.0431?0&lang=ru&format=4" frameborder="0"></iframe>
</body>
</html>
