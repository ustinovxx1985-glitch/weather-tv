<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Погода</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: linear-gradient(160deg, #0f172a 0%, #1e293b 100%);
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            text-align: center;
            padding: 20px;
        }
        .widget {
            background: rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 32px;
            padding: 60px 80px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }
        #city { font-size: 2.5rem; font-weight: 500; letter-spacing: 0.05em; opacity: 0.8; margin-bottom: 10px; }
        #icon { font-size: 7rem; line-height: 1; margin: 10px 0; }
        #temp { font-size: 6rem; font-weight: 200; line-height: 1.1; }
        #temp sup { font-size: 2.5rem; font-weight: 300; vertical-align: super; opacity: 0.7; }
        #desc { font-size: 1.8rem; font-weight: 300; opacity: 0.8; margin-top: 10px; }
        #wind { font-size: 1.4rem; font-weight: 300; opacity: 0.6; margin-top: 30px; }
    </style>
</head>
<body>
    <div class="widget">
        <div id="city">Октябрьский</div>
        <div id="icon">⏳</div>
        <div id="temp">--<sup>°C</sup></div>
        <div id="desc">Загрузка...</div>
        <div id="wind"></div>
    </div>

    <script>
        async function fetchWeather() {
            try {
                // Запрос к российскому API, который не блокируется
                const url = 'https://xn--b1aaibpvbjvx6kj.xn--p1ai/api-weather?city=Октябрьский';
                const response = await fetch(url);
                if (!response.ok) throw new Error(`HTTP error ${response.status}`);
                
                const data = await response.json();
                
                // Данные приходят в полях temp и condition
                const temp = data.temp; // например, "+22"
                const condition = data.condition; // например, "ясно"

                // Простое сопоставление условий с иконками
                let icon = '🌡️';
                if (condition.includes('ясно')) icon = '☀️';
                else if (condition.includes('облачно')) icon = '☁️';
                else if (condition.includes('дождь')) icon = '🌧️';
                else if (condition.includes('снег')) icon = '❄️';

                document.getElementById("temp").innerHTML = `${temp}<sup>°C</sup>`;
                document.getElementById("icon").textContent = icon;
                document.getElementById("desc").textContent = condition;
                // Ветер в этом API может отсутствовать, оставляем пустым
                document.getElementById("wind").textContent = '';

            } catch (error) {
                console.error("Ошибка:", error);
                document.getElementById("desc").textContent = "Ошибка данных";
                document.getElementById("icon").textContent = "⚠️";
            }
        }

        fetchWeather();
        setInterval(fetchWeather, 15 * 60 * 1000); 
    </script>
</body>
</html>
