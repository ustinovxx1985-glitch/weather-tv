<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Погода</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body {
            height: 100%;
            margin: 0;
            overflow: hidden;
            background: #0f172a; /* Наш темный фон */
            display: flex;
            justify-content: center;
            align-items: center;
        }
        /* Растягиваем картинку на весь экран и сохраняем пропорции */
        img {
            width: 100vw;
            height: 100vh;
            object-fit: contain; /* Картинка не будет искажаться, впишется по центру */
            padding: 20px; /* Отступы от краев */
        }
    </style>
</head>
<body>
    <!-- 
      Параметры запроса:
      ?0 - только текущая погода
      &lang=ru - русский язык
      &m - метрическая система (Цельсии и км/ч) 
      &w=800 - ширина картинки в пикселях (делаем больше)
      &background=0f172a - задаем цвет фона картинки под стать нашему сайту
    -->
    <img src="https://wttr.in/56.2194,42.0431.png?0&lang=ru&m&w=800&background=0f172a" alt="Погода">
</body>
</html>
