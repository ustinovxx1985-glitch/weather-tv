name: Auto Trigger Weather

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger weather update
        run: |
          curl -X POST \
            -H "Authorization: token ${{ secrets.GH_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/ustinovxx1985-glitch/weather-tv/actions/workflows/update-weather.yml/dispatches \
            -d '{"ref":"main"}'
