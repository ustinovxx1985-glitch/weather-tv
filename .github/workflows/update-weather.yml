name: Update Weather Data

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  fetch-weather:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch weather from Yandex API
        env:
          YANDEX_API_KEY: ${{ secrets.YANDEX_API_KEY }}
        run: |
          curl -s --fail \
            -H "X-Yandex-Weather-Key: $YANDEX_API_KEY" \
            "https://api.weather.yandex.ru/v2/forecast?lat=56.2194&lon=42.0431&lang=ru_RU&hours=false&extra=false" \
            -o weather-raw.json || echo '{}' > weather-raw.json
          echo "Ответ Яндекса:"
          cat weather-raw.json

      - name: Fetch backup from Open-Meteo
        run: |
          curl -s --fail \
            "https://api.open-meteo.com/v1/forecast?latitude=56.2194&longitude=42.0431&current=temperature_2m,apparent_temperature,relative_humidity_2m,wind_speed_10m,wind_direction_10m,surface_pressure&wind_speed_unit=ms&timezone=Europe%2FMoscow" \
            -o om-raw.json || echo '{}' > om-raw.json
          echo "Ответ Open-Meteo:"
          cat om-raw.json

      - name: Build weather.json
        run: |
          jq -s '
            def r: if type == "number" then round else . end;
            (.[0].fact // {}) as $f |
            (.[1].current // {}) as $c |
            {
              temperature: (($f.temperature // $c.temperature_2m) | r),
              feelsLike: (($f.feels_like // $c.apparent_temperature) | r),
              humidity: (($f.humidity // $c.relative_humidity_2m) | r),
              windSpeed: ($f.wind_speed // $c.wind_speed_10m),
              windDir: ($f.wind_dir // (["n","ne","e","se","s","sw","w","nw"][((($c.wind_direction_10m // 0) + 22.5) / 45 | floor) % 8])),
              pressureMm: ($f.pressure_mm // (if $c.surface_pressure then (($c.surface_pressure * 0.750062) | round) else null end)),
              condition: $f.condition,
              updatedAt: ((now + 10800) | strftime("%d.%m.%Y %H:%M"))
            }
          ' weather-raw.json om-raw.json > weather-new.json
          echo "Свежие данные:"
          cat weather-new.json
          if [ -f weather.json ]; then
            jq -s '
              .[0] as $old | .[1] as $new |
              $new | with_entries(
                .value = (if .value == null and .key != "updatedAt" then $old[.key] else .value end)
              )
            ' weather.json weather-new.json > weather-merged.json
            mv weather-merged.json weather.json
          else
            mv weather-new.json weather.json
          fi
          rm -f weather-new.json
          echo "Готовый файл:"
          cat weather.json

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add weather.json
          if git diff --cached --quiet; then
            echo "Данных нет, нечего сохранять"
          else
            git commit -m "weather update [skip ci]"
            git push
          fi
